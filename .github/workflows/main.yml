name: 终极搬运_所有版本及全部文件
on: 
  workflow_dispatch:

jobs:
  mirror-all-releases:
    runs-on: ubuntu-latest
    permissions:
      contents: write 
    steps:
      - name: 1. 检出当前仓库
        uses: actions/checkout@v4

      - name: 2. 启动全自动循环搬运机
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAGS=$(gh api repos/XrayR-project/XrayR/releases --jq '.[].tag_name')
          
          for TAG in $TAGS; do
            echo "========================================"
            echo "🚀 正在全量搬运版本: $TAG"
            
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "✅ 版本 $TAG 已经存在于你的仓库，自动跳过..."
              continue
            fi
            
            mkdir -p "downloads/$TAG"
            
            echo "⏳ 正在下载 $TAG 的所有文件..."
            gh release download "$TAG" -R XrayR-project/XrayR --dir "downloads/$TAG" --pattern "*" || true
            
            REL_NAME=$(gh api repos/XrayR-project/XrayR/releases/tags/$TAG --jq '.name')
            REL_NOTES=$(gh api repos/XrayR-project/XrayR/releases/tags/$TAG --jq '.body')
            if [ -z "$REL_NAME" ] || [ "$REL_NAME" == "null" ]; then REL_NAME="$TAG"; fi
            echo "$REL_NOTES" > notes.txt
            
            echo "📤 正在上传 $TAG 的所有文件到你的仓库..."
            gh release create "$TAG" "downloads/$TAG/"* -t "$REL_NAME" -F notes.txt
            
            rm -rf "downloads/$TAG" notes.txt
            echo "🎉 版本 $TAG 搬运完成！"
          done
          echo "========================================"
          echo "🏆 所有历史版本已全部搬运完毕！原库已完美克隆！"
