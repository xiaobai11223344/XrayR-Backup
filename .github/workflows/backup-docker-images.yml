name: 备份官方Docker镜像
on: 
  workflow_dispatch: # 手动点击运行

jobs:
  mirror-docker:
    runs-on: ubuntu-latest
    permissions:
      packages: write # 必须开启此权限才能上传镜像到你的个人账号
    steps:
      - name: 登录到 GitHub 容器服务
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 镜像跨仓库搬运
        run: |
          # 自动转换用户名为全小写（Docker 规范要求）
          MY_USER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          
          # 定义源镜像和目标镜像
          # 建议备份 latest（最新版）和 v0.9.0（公认稳定版）
          
          echo "🚚 正在同步 latest 镜像..."
          skopeo copy --all docker://ghcr.io/xrayr-project/xrayr:latest docker://ghcr.io/$MY_USER/xrayr:latest
          
          echo "🚚 正在同步 v0.9.0 镜像..."
          skopeo copy --all docker://ghcr.io/xrayr-project/xrayr:v0.9.0 docker://ghcr.io/$MY_USER/xrayr:v0.9.0
          
          echo "✅ 所有镜像同步完成！"
